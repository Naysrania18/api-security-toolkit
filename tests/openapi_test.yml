openapi: 3.0.3
info:
  title: Local vulnerable test API
  version: "1.0"
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  schemas:
    NoteInput:
      type: object
      required: [text]
      properties:
        text: { type: string }
paths:
  /api/notes:
    get:
      security: [{ bearer: [] }]
      responses: { "200": { description: ok } }
    post:
      security: [{ bearer: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NoteInput" }
      responses: { "201": { description: created } }
  /api/notes/{note_id}:
    get:
      security: [{ bearer: [] }]
      parameters:
        - { name: note_id, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: ok } }
  /api/safe-notes:
    get:
      security: [{ bearer: [] }]
      responses: { "200": { description: ok } }
  /api/safe-notes/{note_id}:
    get:
      security: [{ bearer: [] }]
      parameters:
        - { name: note_id, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: ok } }
  /api/admin/stats:
    get:
      security: [{ bearer: [] }]
      responses: { "200": { description: ok } }
  /api/me:
    get:
      security: [{ bearer: [] }]
      responses: { "200": { description: ok } }
  /api/search:
    get:
      parameters:
        - { name: q, in: query, schema: { type: string } }
      responses: { "200": { description: ok } }
  /api/profile:
    get:
      security: [{ bearer: [] }]
      responses: { "200": { description: ok } }
